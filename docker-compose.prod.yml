services:
  db:
    image: postgres:15-alpine
    container_name: st_project_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10  

  redis:
    image: redis:7-alpine
    container_name: st_project_redis
    restart: unless-stopped
    networks:
      - backend

  chown-fix:
    image: alpine:latest
    user: "0:0"
    command: >
      sh -c "chown -R 1000:1000 /app/experiments /app/uploads &&
             echo 'Permissions fixed for experiments and uploads'"
    volumes:
      - ${HOST_EXPERIMENTS_ROOT}:/app/experiments
      - ${HOST_UPLOADS_ROOT}:/app/uploads
    restart: "no"    

  migrate:
    image: tawhidmm/st_project:api-latest
    container_name: st_project_migrate
    command: alembic upgrade head
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - backend

  tusd:
    image: tusproject/tusd:v2.5.0
    container_name: st_project_tusd
    restart: unless-stopped
    command: >
      -upload-dir /srv/tusd-data
      -base-path /uploads/
      -behind-proxy
      -hooks-http http://api:8000/webhooks/tus
      -hooks-enabled-events pre-create,post-finish
    volumes:
      - ${HOST_UPLOADS_ROOT}:/srv/tusd-data
    networks:
      - backend
      - frontend

  api:
    container_name: st_project_api
    image: tawhidmm/st_project:api-latest
    restart: unless-stopped
    depends_on:
      chown-fix:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_started
      tusd:
        condition: service_started
    env_file:
      - .env
    volumes:
      - ${HOST_EXPERIMENTS_ROOT}:/app/experiments
      - ${HOST_UPLOADS_ROOT}:/app/uploads
    networks:
      - backend
      - frontend

  worker:
    container_name: st_project_worker
    image: tawhidmm/st_project:worker-latest
    command: celery -A app.core.celery.celery_app worker --loglevel=info --concurrency=${WORKER_CONCURRENCY:-1}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    group_add:
      - "${DOCKER_GID}"  
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_EXPERIMENTS_ROOT}:/app/experiments
      - ${HOST_UPLOADS_ROOT}:/app/uploads
    networks:
      - backend

  worker-io:
      container_name: st_project_worker_io
      image: tawhidmm/st_project:worker-latest
      command: celery -A app.core.celery.celery_app worker --loglevel=info --concurrency=${WORKER_IO_CONCURRENCY:-4} -Q io
      restart: unless-stopped
      depends_on:
        migrate:
          condition: service_completed_successfully
        db:
          condition: service_healthy
        redis:
          condition: service_started
      env_file:
        - .env
      volumes:
        - ${HOST_EXPERIMENTS_ROOT}:/app/experiments
        - ${HOST_UPLOADS_ROOT}:/app/uploads
      networks:
        - backend      

  beat:
    container_name: st_project_beat
    image: tawhidmm/st_project:worker-latest
    command: celery -A app.core.celery.celery_app beat --loglevel=info -s /tmp/celerybeat-schedule
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    env_file:
      - .env
    networks:
      - backend

  frontend:
    image: tawhidmm/st_project:frontend-latest
    container_name: st_project_frontend
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - frontend

  nginx:
    image: nginx:alpine
    container_name: st_project_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - api
      - tusd
    networks:
      - frontend

volumes:
  postgres_data:

networks:
  backend:
  frontend: