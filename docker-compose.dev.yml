services:
  db:
    image: postgres:15-alpine
    container_name: st_project_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: st_project_redis
    restart: unless-stopped
    networks:
      - backend

  tusd:
    image: tusproject/tusd:v2.5.0
    container_name: st_project_tusd
    restart: unless-stopped
    command: >
      -upload-dir /srv/tusd-data
      -base-path /uploads/
      -hooks-http http://api:8000/webhooks/tus
      -hooks-enabled-events pre-create,post-finish
    volumes:
      - ${HOST_UPLOADS_ROOT}:/srv/tusd-data
    networks:
      - backend
      - frontend

  chown-fix:
    image: alpine:latest
    user: "0:0"
    command: >
      sh -c "chown -R 1000:1000 /app/experiments /app/uploads &&
             echo 'Permissions fixed for experiments and uploads'"
    volumes:
      - ${HOST_EXPERIMENTS_ROOT}:/app/experiments
      - ${HOST_UPLOADS_ROOT}:/app/uploads
    restart: "no"        

  api:
    build: ./backend
    container_name: st_project_api
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped
    depends_on:
      - db
      - redis
      - tusd
    env_file:
      - .env
    volumes:
      - ${HOST_EXPERIMENTS_ROOT}:/app/experiments
      - ${HOST_UPLOADS_ROOT}:/app/uploads
    networks:
      - backend
      - frontend

  worker:
    build: ./backend
    container_name: st_project_worker
    command: celery -A app.core.celery.celery_app worker --loglevel=info --concurrency=1
    restart: unless-stopped
    depends_on:
      - db
      - redis
    env_file:
      - .env
    group_add:
      - "${DOCKER_GID}"  
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_EXPERIMENTS_ROOT}:/app/experiments
      - ${HOST_UPLOADS_ROOT}:/app/uploads
    networks:
      - backend

  worker-io:
    build: ./backend
    container_name: st_project_worker_io
    command: celery -A app.core.celery.celery_app worker --loglevel=info --concurrency=4 -Q io
    restart: unless-stopped
    depends_on:
      - db
      - redis
    env_file:
      - .env
    volumes:
      - ${HOST_EXPERIMENTS_ROOT}:/app/experiments
      - ${HOST_UPLOADS_ROOT}:/app/uploads
    networks:
      - backend      

  frontend:
    build: ./frontend
    container_name: st_project_frontend
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - frontend

  nginx:
    image: nginx:alpine
    container_name: st_project_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - api
      - tusd
    networks:
      - frontend

  dozzle:
    image: amir20/dozzle:latest
    container_name: st_project_dozzle
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock    

volumes:
  postgres_data:

networks:
  backend:
  frontend: