services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: ci
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ci -d ci"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  chown-fix:
    image: alpine:latest
    user: "0:0"
    command: sh -c "mkdir -p /app/experiments /app/uploads && chown -R 1000:1000 /app/experiments /app/uploads"
    volumes:
      - experiments:/app/experiments
      - uploads:/app/uploads

  api:
    image: ${BACKEND_IMAGE}
    env_file:
      - .env.ci
    depends_on:
      chown-fix:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - experiments:/app/experiments
      - uploads:/app/uploads
    ports:
      - "8000:8000"

  worker:
    image: ${BACKEND_IMAGE}
    command: celery -A app.core.celery.celery_app worker --loglevel=info --concurrency=1
    env_file:
      - .env.ci
    depends_on:
      chown-fix:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - experiments:/app/experiments
      - uploads:/app/uploads

volumes:
  experiments:
  uploads: